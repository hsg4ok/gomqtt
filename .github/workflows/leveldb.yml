name: Go tests

on:
  push:
    branches: ["feature/leveldb-backend-v0144"]
  pull_request:
    branches: ["master"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ["1.20.x", "1.23.x"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true
      - name: Download modules
        run: go mod download
      - name: Unit tests
        run: go test -mod=mod ./...
      - name: Race tests
        if: matrix.go-version == '1.23.x'
        run: go test -mod=mod -race ./...
      - name: Vet
        run: go vet -mod=mod ./...
