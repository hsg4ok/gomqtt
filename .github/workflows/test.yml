name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: true
      - name: Install Mosquitto
        run: |
          sudo apt-get update
          sudo apt-get install -y mosquitto
          sudo systemctl enable --now mosquitto
      - name: Install mkcert
        run: go install filippo.io/mkcert@v1.4.4
      - name: Generate test TLS certificates
        run: make cert
      - name: Run all tests
        run: go test -mod=mod ./...
